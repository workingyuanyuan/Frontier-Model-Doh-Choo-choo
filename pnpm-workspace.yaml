packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true

# picomatch <=4.0.7 (ReDoS) has no patched release yet. It is reached only
# through vitest and typescript-eslint, on this repository's own glob patterns.
# Remove this entry and upgrade once picomatch 4.0.8 is published.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf

overrides:
  baseline-browser-mapping: 2.11.0
  brace-expansion: 5.0.12
  nanoid: 3.3.18
  postcss: 8.5.23
  sharp: 0.35.5
  vite: 8.1.6

catalog:
  next: 16.4.6
  react: 19.2.7
  react-dom: 19.2.7
  typescript: 5.9.3
  vitest: 4.1.12
  zod: 4.6.7
