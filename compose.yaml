name: llm-bench-radar

services:
  postgres:
    image: postgres:18.4-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llm_bench}
      POSTGRES_USER: ${POSTGRES_USER:-llm_bench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llm_bench_dev}
    ports:
      - '${POSTGRES_PORT:-54329}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
