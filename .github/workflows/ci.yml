name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, database, and render smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_DB: llm_bench
          POSTGRES_USER: llm_bench
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llm_bench -d llm_bench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      DATABASE_URL: postgresql://llm_bench:ci-only-password@localhost:5432/llm_bench

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

      - name: Lint source files
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Run unit and integration tests
        run: pnpm test:run
        env:
          RUN_DB_INTEGRATION_TESTS: '1'

      - name: Seed canonical dimensions and themes
        run: pnpm db:seed

      - name: Build production applications
        run: pnpm build

      - name: Install Chromium for browser gates
        run: pnpm exec playwright install --with-deps chromium

      - name: Seed isolated browser fixture
        run: pnpm e2e:seed
        env:
          E2E_FIXTURE: '1'

      - name: Run browser, accessibility, performance, and security gates
        run: pnpm e2e

      - name: Reject high or critical dependency advisories
        run: pnpm audit --audit-level high

      - name: Render representative video frame
        run: pnpm video:still

      - name: Export snapshot-bound video metadata
        run: pnpm video:artifacts

      - name: Upload render smoke artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: video-render-smoke-${{ github.run_id }}
          path: |
            artifacts/llm-bench-weekly.png
            output/llm-bench-weekly.metadata.json
            output/llm-bench-weekly.ranking.csv
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser gate report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-gates-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: error
          retention-days: 7
