name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static data and Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: true
      LLM_BENCH_CHANNEL: DRAFT

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

      - name: Lint source files
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build production applications
        run: pnpm build

      - name: Install Chromium for Dashboard gates
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Dashboard browser and accessibility gates
        run: pnpm e2e

      - name: Reject high or critical dependency advisories
        run: pnpm audit --audit-level high
