name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# The gates run as parallel jobs: static checks beside the build, and the
# browser suite split into shards once the build exists. `quality` waits for
# all of them and is the single check that deploys and branch rules rely on.
# Concurrency is per job, never workflow-wide, so a newer push cannot cancel a
# deploy that is already running.
#
# A main push that merges a PR whose CI run built this exact tree skips the
# gates and deploys that run's verified Pages artifact. Any miss or error in
# `reuse` runs every gate instead.
jobs:
  reuse:
    name: Reuse verified PR build
    if: >-
      github.event_name == 'push' &&
      github.repository == 'workingyuanyuan/Frontier-Model-Doh-Choo-choo' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # No concurrency group: a cancelled reuse would start its fallback gates
    # late, after a newer push's, and cancel those instead.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      hit: ${{ steps.reused.outputs.hit }}
      artifact: ${{ steps.reused.outputs.artifact }}
      indexnow: ${{ steps.indexnow.outputs.body }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0

      # Every step below runs only if the one before it succeeded; a failure
      # leaves `hit` unset, which runs the full pipeline.
      - name: Find the PR run that verified this merge
        id: find
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/find-verified-pr-build.mjs find

      - name: Download that run's verification receipt
        id: receipt
        if: steps.find.outcome == 'success' && steps.find.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-build-${{ steps.find.outputs.attempt }}
          path: reuse/receipt
          run-id: ${{ steps.find.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Require the PR run to have built this tree
        id: check
        if: steps.receipt.outcome == 'success'
        continue-on-error: true
        env:
          RUN_ID: ${{ steps.find.outputs.run-id }}
          ATTEMPT: ${{ steps.find.outputs.attempt }}
        run: node scripts/find-verified-pr-build.mjs check reuse/receipt/receipt "$RUN_ID" "$ATTEMPT"

      - name: Download the verified Pages artifact
        id: download
        if: steps.check.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.check.outputs.artifact }}
          path: reuse/pages
          run-id: ${{ steps.find.outputs.run-id }}
          github-token: ${{ github.token }}

      # upload-pages-artifact leaves dotfiles such as .nojekyll out of the
      # archive, so only the site itself is checked.
      - name: Check the archive holds the site
        id: archive
        if: steps.download.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p reuse/out
          tar -xf reuse/pages/artifact.tar -C reuse/out
          test -f reuse/out/index.html

      # deploy-pages only reads artifacts of its own run, so the PR's archive
      # is uploaded again unchanged. The name differs from `build`'s so a
      # fallback build in this run can still upload its own.
      - name: Upload it as this run's Pages artifact
        id: upload
        if: steps.archive.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages-reused-${{ github.run_id }}-${{ github.run_attempt }}
          path: reuse/pages/artifact.tar
          if-no-files-found: error
          retention-days: 7

      - name: Mark the PR build as reused
        id: reused
        if: steps.upload.outcome == 'success'
        env:
          PR: ${{ steps.find.outputs.pr }}
          RUN_ID: ${{ steps.find.outputs.run-id }}
        run: |
          echo "hit=true" >> "$GITHUB_OUTPUT"
          echo "artifact=github-pages-reused-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "Reused the Pages artifact PR #$PR verified in run $RUN_ID" >> "$GITHUB_STEP_SUMMARY"

      # Same comparison as in `build`; it never blocks the deploy, and its
      # own timeout keeps it from timing out the job after the hit.
      - name: List pages changed since the live deployment
        id: indexnow
        if: steps.reused.outputs.hit == 'true'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          body=$(node scripts/indexnow.mjs reuse/out)
          printf 'body=%s\n' "$body" >> "$GITHUB_OUTPUT"

  checks:
    name: Static checks
    needs: reuse
    if: ${{ !cancelled() && !(needs.reuse.result == 'success' && needs.reuse.outputs.hit == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-checks
      cancel-in-progress: true
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Reject high or critical dependency advisories
        run: pnpm audit --audit-level high

      # `pnpm format` keys its cache on file content, so a restored cache only
      # skips files whose bytes Prettier already accepted with this version
      # and configuration; every changed file is still checked.
      - name: Restore Prettier cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/prettier
          key: prettier-${{ runner.os }}-${{ github.sha }}
          restore-keys: prettier-${{ runner.os }}-

      - name: Check formatting
        run: pnpm format

      - name: Lint source files
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      # Fails when current.json or the frontier files were not rebuilt after a
      # source, mapping or scoring change (`pnpm data:release`).
      - name: Check the product matches its sources and mappings
        run: pnpm data:verify-fresh

  build:
    name: Build dashboard
    needs: reuse
    if: ${{ !cancelled() && !(needs.reuse.result == 'success' && needs.reuse.outputs.hit == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: true
    outputs:
      sha: ${{ steps.pages.outputs.sha }}
      tree: ${{ steps.pages.outputs.tree }}
      artifact: ${{ steps.pages.outputs.artifact }}
      e2e: ${{ steps.pages.outputs.e2e }}
      indexnow: ${{ steps.indexnow.outputs.body }}
    env:
      CI: true
      NEXT_PUBLIC_BASE_PATH: ${{ format('/{0}', github.event.repository.name) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}

      - name: Record source SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Pages build SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Build production applications
        run: pnpm build

      # Compare each page's data file with the live one before the deploy
      # replaces it. A failed comparison shows as a warning and submits
      # nothing; it never blocks the deploy.
      - name: List pages changed since the live deployment
        id: indexnow
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          body=$(node scripts/indexnow.mjs apps/bench/out)
          printf 'body=%s\n' "$body" >> "$GITHUB_OUTPUT"

      # Both artifacts are named per run attempt, so a rerun can never pick
      # up another attempt's export. They are uploaded before the other gates
      # finish; only `quality` passing lets the deploy job use one.
      - name: Prepare Pages artifact
        id: pages
        run: |
          touch apps/bench/out/.nojekyll
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "artifact=github-pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "e2e=e2e-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      # The e2e shards test exactly this export, and import the built
      # benchmark-data package for their expectations. Kept for a week so a
      # failed shard can still be rerun on its own.
      - name: Upload build for the browser gates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.pages.outputs.e2e }}
          path: |
            apps/bench/out
            packages/benchmark-data/dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: ${{ steps.pages.outputs.artifact }}
          path: apps/bench/out
          retention-days: 7

  e2e:
    name: Dashboard browser gates (${{ matrix.shard }}/3)
    needs: build
    # Explicit, because the implicit success() also fails when `reuse`, an
    # ancestor through `build`, was skipped.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-e2e-${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3]
    env:
      CI: true
      NEXT_PUBLIC_BASE_PATH: ${{ format('/{0}', github.event.repository.name) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Download the build under test
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.e2e }}

      # The browser download is cached per Playwright version. The system
      # packages come from the runner's apt mirror, which has stalled for
      # over ten minutes; bounded attempts turn a stall into a retry.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Restore Chromium cache
        id: chromium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium for Dashboard gates
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      # timeout runs as root so that, on expiry, it kills its whole process
      # group: Playwright running as root calls apt-get without sudo, and
      # Dpkg::Use-Pty off stops apt moving dpkg into its own session, so no
      # orphaned apt-get or dpkg keeps a lock and blocks the next attempt.
      - name: Install Chromium system packages
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nDpkg::Use-Pty "false";\n' |
            sudo tee /etc/apt/apt.conf.d/80-ci-retries > /dev/null
          for attempt in 1 2 3; do
            sudo timeout --kill-after=15 240 "$(command -v node)" \
              node_modules/@playwright/test/cli.js install-deps chromium && exit 0
            echo "::warning::Chromium system packages attempt $attempt failed"
            sudo timeout --kill-after=15 120 dpkg --configure -a || true
          done
          exit 1

      - name: Run Dashboard browser and accessibility gates
        run: pnpm e2e --shard=${{ matrix.shard }}/3

      # quality requires one receipt per shard naming the build it tested,
      # instead of trusting the matrix's combined result alone.
      - name: Write shard receipt
        env:
          SHARD: ${{ matrix.shard }}
          TESTED: ${{ needs.build.outputs.e2e }}
        run: |
          mkdir -p e2e-receipt
          printf '%s\n' "$TESTED" > "e2e-receipt/shard-$SHARD-attempt-$GITHUB_RUN_ATTEMPT"

      - name: Upload shard receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-receipt-${{ matrix.shard }}-${{ github.run_attempt }}
          path: e2e-receipt
          if-no-files-found: error
          retention-days: 7

      # Without this, an e2e failure that only reproduces on the runner leaves
      # nothing to debug with: the traces exist but never leave the machine.
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Fails closed: it runs whenever the workflow was not cancelled and passes
  # only if every gate job succeeded for this SHA, or `reuse` found the PR
  # run that did so for this tree. A failed or skipped gate can never surface
  # as a passing (skipped) check.
  quality:
    name: Static data and Dashboard
    needs: [reuse, checks, build, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.verified.outputs.sha }}
      artifact: ${{ steps.verified.outputs.artifact }}
      indexnow: ${{ needs.build.outputs.indexnow || needs.reuse.outputs.indexnow }}
    steps:
      - name: Download shard receipts
        if: ${{ !(needs.reuse.result == 'success' && needs.reuse.outputs.hit == 'true') }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: e2e-receipt-*
          merge-multiple: true
          path: e2e-receipt

      - name: Require every gate to pass
        id: verified
        env:
          REUSED: ${{ needs.reuse.outputs.hit }}
          REUSE: ${{ needs.reuse.result }}
          REUSED_ARTIFACT: ${{ needs.reuse.outputs.artifact }}
          CHECKS: ${{ needs.checks.result }}
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
          BUILT_SHA: ${{ needs.build.outputs.sha }}
          TREE: ${{ needs.build.outputs.tree }}
          ARTIFACT: ${{ needs.build.outputs.artifact }}
          TESTED: ${{ needs.build.outputs.e2e }}
        run: |
          echo "reuse=$REUSE/$REUSED checks=$CHECKS build=$BUILD e2e=$E2E"
          if [ "$REUSE" = success ] && [ "$REUSED" = true ]; then
            test "$CHECKS" = skipped
            test "$BUILD" = skipped
            test "$E2E" = skipped
            test -n "$REUSED_ARTIFACT"
            ARTIFACT=$REUSED_ARTIFACT
            echo "Reusing the PR build verified for this tree" >> "$GITHUB_STEP_SUMMARY"
          else
            test "$CHECKS" = success
            test "$BUILD" = success
            test "$E2E" = success
            test "$BUILT_SHA" = "$GITHUB_SHA"
            test -n "$TREE"
            test -n "$ARTIFACT"
            test -n "$TESTED"
            for shard in 1 2 3; do
              grep -qxF "$TESTED" e2e-receipt/shard-$shard-attempt-* ||
                { echo "::error::No receipt from shard $shard for $TESTED"; exit 1; }
            done
            mkdir -p verified-build
            printf 'tree=%s\nartifact=%s\n' "$TREE" "$ARTIFACT" > verified-build/receipt
            echo "All quality gates passed for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      # Written only after every gate passed: the main push that merges this
      # PR checks it names this tree before deploying the artifact. Without
      # it main runs every gate, so a failed upload does not fail the PR.
      - name: Upload verification receipt
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-build-${{ github.run_attempt }}
          path: verified-build
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy verified dashboard
    needs: quality
    # !cancelled(): the implicit success() would skip this job whenever
    # `reuse` stood in for the gates, since they are skipped ancestors.
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      github.repository == 'workingyuanyuan/Frontier-Model-Doh-Choo-choo' &&
      github.ref == 'refs/heads/main' &&
      needs.quality.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    # queue: max keeps every pending deploy; with the default single slot an
    # older run could replace the pending current one and then fail the
    # current-main guard, leaving main undeployed.
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Check inside the deployment lock: an older rerun must never replace main.
      - name: Verify current main and artifact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          VERIFIED_SHA: ${{ needs.quality.outputs.sha }}
        run: node scripts/verify-pages-deployment.mjs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ needs.quality.outputs.artifact }}

  # Tell IndexNow search engines (Bing and others; not Google) which pages
  # changed, once they are live.
  indexnow:
    name: Notify IndexNow of changed pages
    needs: [quality, deploy]
    if: >-
      !cancelled() &&
      needs.deploy.result == 'success' &&
      needs.quality.outputs.indexnow != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The site is already live; a rejected or failed submission is a
      # warning, not a failed deploy.
      - name: Submit changed pages
        continue-on-error: true
        env:
          BODY: ${{ needs.quality.outputs.indexnow }}
        run: >
          curl --silent --show-error --fail-with-body --max-time 30
          -X POST -H 'Content-Type: application/json; charset=utf-8'
          --data "$BODY" https://api.indexnow.org/indexnow
          -w 'IndexNow HTTP %{http_code}\n'
