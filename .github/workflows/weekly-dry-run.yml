name: Weekly benchmark dry run

on:
  schedule:
    # 09:15 Monday in Asia/Taipei (UTC+8, no daylight saving time).
    - cron: '15 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-benchmark-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    name: Ingest, validate, and render without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_DB: llm_bench
          POSTGRES_USER: llm_bench
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llm_bench -d llm_bench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      DATABASE_URL: postgresql://llm_bench:ci-only-password@localhost:5432/llm_bench
      LIVEBENCH_LENGTH: '100'
      LIVEBENCH_OFFSET: '0'
      RAW_STORAGE_DIR: ${{ runner.temp }}/llm-bench-raw

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Prepare transient artifact directory
        run: mkdir -p artifacts

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Seed canonical dimensions and themes
        run: pnpm db:seed

      - name: Ingest one official LiveBench page
        run: pnpm ingest:livebench | tee artifacts/livebench-ingestion.log

      - name: Run validation tests
        run: pnpm test:run

      - name: Render dry-run poster
        run: pnpm video:still

      - name: Export snapshot-bound video metadata
        run: pnpm video:artifacts

      - name: Upload immutable dry-run evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weekly-dry-run-${{ github.run_id }}
          path: |
            artifacts/livebench-ingestion.log
            artifacts/llm-bench-weekly.png
            output/llm-bench-weekly.metadata.json
            output/llm-bench-weekly.ranking.csv
            ${{ runner.temp }}/llm-bench-raw
          if-no-files-found: error
          retention-days: 14
